<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Data</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1.2rem; padding: .6rem 1.2rem; }
    .error { background: #fdecea; color: #b71c1c; padding: .75rem; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Submit Data</h1>
  {% if error %}<div class="error">Error: {{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('form') }}">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ values.get('name', '') }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ values.get('email', '') }}" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4">{{ values.get('message', '') }}</textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
